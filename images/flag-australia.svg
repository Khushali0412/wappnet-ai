<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#012169"/>
  <!-- Canton Union Jack -->
  <g>
    <clipPath id="canton">
      <rect width="256" height="256"/>
    </clipPath>
    <g clip-path="url(#canton)">
      <rect width="256" height="256" fill="#012169"/>
      <path d="M0,0 L256,256 M256,0 L0,256" stroke="#fff" stroke-width="40"/>
      <path d="M0,0 L256,256 M256,0 L0,256" stroke="#C8102E" stroke-width="24"/>
      <path d="M128,0 V256 M0,128 H256" stroke="#fff" stroke-width="60"/>
      <path d="M128,0 V256 M0,128 H256" stroke="#C8102E" stroke-width="36"/>
    </g>
  </g>
  <!-- Commonwealth Star -->
  <polygon points="128,330 137,358 166,358 143,375 152,403 128,386 104,403 113,375 90,358 119,358" fill="#fff"/>
  <!-- Southern Cross Stars -->
  <!-- Gamma Crucis -->
