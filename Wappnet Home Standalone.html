document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ver{color:#C2571A}\n  h1,h2,h3,h4,h5{margin:0;font-family:\"Archivo\",system-ui,sans-serif;color:#141414;line-height:1.24;letter-spacing:-.02em}\n  p{margin:0}\n  @keyframes panelIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}\n  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}\n  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<script type=\"application/ld+json\">{\n \"@context\": \"https://schema.org\",\n \"@type\": \"FAQPage\",\n \"mainEntity\": [\n  {\n   \"@type\": \"Question\",\n   \"name\": \"How long does an AI project take?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"A first production release usually takes 10 to 16 weeks: two weeks to frame the use case, four to six to prove it on your data, and the remainder to engineer and deploy it. Narrow automations ship sooner; regulated environments take longer because of review cycles, not build time.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"Do we need clean data before we start?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"No. We work with the data you already have and fix only what the chosen use case depends on. A full data cleanup before a first project typically delays value by a year without changing the outcome.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"What does a first engagement cost?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"The two-week AI opportunity assessment is a fixed fee, and every stage after it is quoted separately. You can stop at the end of any stage without a contractual argument.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"How do you decide which use case to start with?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"We rank candidates on business value, data readiness and effort, then start with the highest-value one your existing data already supports. Anything that needs new data collection gets sequenced later.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"Who owns the code and the models?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"You do, from the first commit. Work happens in your repositories and your cloud accounts, under your licence terms, so nothing is locked behind our tooling.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"Who is actually on the team?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"Senior pods of three to six engineers who have shipped the same class of system before. The people on your first call stay on the account through delivery.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"Do you work alongside our own engineers?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"Yes. We work inside your repo, ticket tracker and coding standards, and treat runbooks and architecture notes as deliverables rather than favours.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"What happens after launch?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"Your team takes it over with documentation, or we operate it on an agreed support window with retraining schedules, drift alerts and rollback paths in place.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"Is Wappnet.ai certified?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"Yes. We hold ISO 27001 and SOC 2 Type II, and we have completed enterprise vendor reviews in regulated healthcare and financial services environments.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"Where does our data live?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"In your cloud accounts and regions. We build inside your tenancy, so data does not leave your environment for training or inference unless you explicitly ask for it.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"Can models run without sending data to a third party?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"Yes. Where data residency or privacy rules rule out a hosted API, we deploy open-weight models inside your own environment and tune them there.\"\n   }\n  },\n  {\n   \"@type\": \"Question\",\n   \"name\": \"How do you stop an AI system failing quietly?\",\n   \"acceptedAnswer\": {\n    \"@type\": \"Answer\",\n    \"text\": \"Every system ships with an evaluation set, a regression suite and a refusal policy, so any prompt or model change is scored before it reaches production.\"\n   }\n  }\n ]\n}<\u002Fscript>\n<script src=\"2f944350-875f-429e-b1e4-0554415f266b\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div data-screen-label=\"Home\" style=\"overflow-x:clip\">\n\n  <header ref=\"{{ headerRef }}\" sc-camel-on-mouse-leave=\"{{ closeMenu }}\" style=\"position:fixed;top:0;left:0;right:0;z-index:80;background:transparent;border-bottom:1px solid transparent;transition:background .3s ease,border-color .3s ease\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 24px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n      <a href=\"#top\" style=\"display:flex;align-items:center;flex:none\"><img src=\"9019bff1-8e98-49ff-adb6-fbdc581d2e57\" alt=\"Wappnet.ai\" style=\"height:26px;width:auto;display:block\"><\u002Fa>\n\n      <nav hidden=\"{{ narrow }}\" style=\"margin-left:auto\">\n       <div style=\"display:flex;align-items:center;gap:2px\">\n        <div sc-camel-on-mouse-enter=\"{{ open_services }}\" style=\"padding:24px 13px;font-size:14.5px;font-weight:500;color:#fff;cursor:default;white-space:nowrap\">Services<\u002Fdiv>\n        <div sc-camel-on-mouse-enter=\"{{ open_solutions }}\" style=\"padding:24px 13px;font-size:14.5px;font-weight:500;color:#fff;cursor:default;white-space: adding:0 0 112px\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 24px\">\n      <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:52px\">\n        <div>\n          <div style=\"font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#C2571A;margin-bottom:16px\">Reading<\u002Fdiv>\n          <h2 style=\"font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.22;max-width:24ch;text-wrap:pretty\">What we are writing and where we will be<\u002Fh2>\n        <\u002Fdiv>\n        <a href=\"#\" style=\"font-family:'Archivo',sans-serif;font-weight:700;font-size:15.5px;color:#0D0D0F;display:inline-flex;align-items:center;gap:8px;border-bottom:2px solid #F49B3D;padding-bottom:2px\" style-hover=\"color:#C2571A\">All insights <span>→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;align-items:stretch\">\n        <a href=\"#\" data-reveal=\"\" style=\"display:flex;flex-direction:column;background:#fff;border:1px solid #E9E7E3;border-radius:12px;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.10);color:#0D0D0F\">\n          <div style=\"position:relative;height:340px\">\n            <image-slot id=\"ins-blog\" shape=\"rect\" placeholder=\"Blog hero · 760×680px\"><\u002Fimage-slot>\n            <span style=\"position:absolute;top:16px;left:16px;background:#fff;color:#0D0D0F;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;padding:7px 14px;pointer-events:none\">Blog<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:30px;display:flex;flex-direction:column;gap:14px\">\n            <div style=\"font-size:14px;color:#8a8a8a\">12 Aug 2026<\u002Fdiv>\n            <h3 style=\"font-size:22px;font-weight:700;line-height:1.34\">The evaluation set is the first thing to write, not the last<\u002Fh3>\n            <p style=\"font-size:15.5px;color:#666\">On every LLM project we score before we prompt. Here is what that discipline saves you around month three.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fa>\n\n        <div style=\"display:grid;grid-template-rows:1fr 1fr;gap:24px\">\n          <a href=\"#\" data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,44%) 1fr;background:#fff;border:1px solid #E9E7E3;border-radius:12px;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.10);color:#0D0D0F\">\n            <div style=\"position:relative;min-height:210px\">\n              <image-slot id=\"ins-news\" shape=\"rect\" placeholder=\"AI news image · 520×460px\"><\u002Fimage-slot>\n              <span style=\"position:absolute;top:16px;left:16px;background:#fff;color:#0D0D0F;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;padding:7px 14px;pointer-events:none\">AI News<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:26px;display:flex;flex-direction:column;gap:11px;justify-content:center\">\n              <div style=\"font-size:14px;color:#8a8a8a\">29 Jul 2026<\u002Fdiv>\n              <h3 style=\"font-size:19px;font-weight:700;line-height:1.35\">Now a Databricks partner: what it changes for you<\u002Fh3>\n              <p style=\"font-size:15px;color:#666\">Shorter procurement, direct escalation, and pricing we can pass through on lakehouse work.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fa>\n          <a href=\"#\" data-reveal=\"\" style=\"display:grid;grid-template-columns:minmax(0,44%) 1fr;background:#fff;border:1px solid #E9E7E3;border-radius:12px;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease\" style-hover=\"transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.10);color:#0D0D0F\">\n            <div style=\"position:relative;min-height:210px\">\n              <image-slot id=\"ins-event\" shape=\"rect\" placeholder=\"Event image · 520×460px\"><\u002Fimage-slot>\n              <span style=\"position:absolute;top:16px;left:16px;background:#fff;color:#0D0D0F;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;padding:7px 14px;pointer-events:none\">Event<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding:26px;display:flex;flex-direction:column;gap:11px;justify-content:center\">\n              <div style=\"font-size:14px;color:#8a8a8a\">05 Sep 2026<\u002Fdiv>\n              <h3 style=\"font-size:19px;font-weight:700;line-height:1.35\">Applied AI clinic: bring a use case, leave with an estimate<\u002Fh3>\n              <p style=\"font-size:15px;color:#666\">Half a day in Ahmedabad, twelve seats, no sales deck. Engineers only.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"faq\" style=\"padding:0 0 112px\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 24px\">\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:48px 64px;align-items:start;padding-top:56px;border-top:1px solid #E4E1DC\">\n        <div>\n          <h2 style=\"font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.22;max-width:20ch;text-wrap:pretty\">Answers to questions about<\u002Fh2>\n          <div style=\"position:relative;margin-top:6px;display:inline-block\">\n            <button sc-camel-on-click=\"{{ faqMenuToggle }}\" style=\"background:none;border:0;padding:0;display:inline-flex;align-items:center;gap:14px;cursor:pointer;font-family:'Archivo',sans-serif;font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.22;color:#C2571A;text-align:left\">\n              <span style=\"text-wrap:pretty\">{{ faqGroupName }}<\u002Fspan>\n              <span style=\"font-size:20px;line-height:1;flex:none\">⌄<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqMenuOpen }}\">\n              <div style=\"position:absolute;top:calc(100% + 10px);left:0;z-index:10;background:#fff;border:1px solid #E4E1DC;border-radius:12px;box-shadow:0 24px 48px rgba(0,0,0,.12);display:flex;flex-direction:column;min-width:260px;overflow:hidden\">\n            <button sc-camel-on-click=\"{{ faqSet0 }}\" style=\"background:none;border:0;border-bottom:1px solid #EEECE8;padding:14px 18px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15.5px;color:#333;white-space:nowrap\" style-hover=\"background:#F7F6F4\">AI projects<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ faqSet1 }}\" style=\"background:none;border:0;border-bottom:1px solid #EEECE8;padding:14px 18px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15.5px;color:#333;white-space:nowrap\" style-hover=\"background:#F7F6F4\">Working with us<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ faqSet2 }}\" style=\"background:none;border:0;border-bottom:1px solid #EEECE8;padding:14px 18px;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:15.5px;color:#333;white-space:nowrap\" style-hover=\"background:#F7F6F4\">Data, security and compliance<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <p style=\"margin-top:24px;font-size:16px;line-height:1.65;color:#666;max-width:38ch\">Still unanswered? Send the question to <a href=\"#contact\" style=\"color:#C2571A;border-bottom:1px solid rgba(194,87,26,.4)\">an engineer<\u002Fa> rather than a form.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n        <sc-if value=\"{{ faqGroup0 }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle0_0 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">How long does an AI project take?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign0_0 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen0_0 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">A first production release usually takes 10 to 16 weeks: two weeks to frame the use case, four to six to prove it on your data, and the remainder to engineer and deploy it. Narrow automations ship sooner; regulated environments take longer because of review cycles, not build time.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle0_1 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">Do we need clean data before we start?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign0_1 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen0_1 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">No. We work with the data you already have and fix only what the chosen use case depends on. A full data cleanup before a first project typically delays value by a year without changing the outcome.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle0_2 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">What does a first engagement cost?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign0_2 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen0_2 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">The two-week AI opportunity assessment is a fixed fee, and every stage after it is quoted separately. You can stop at the end of any stage without a contractual argument.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle0_3 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">How do you decide which use case to start with?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign0_3 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen0_3 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">We rank candidates on business value, data readiness and effort, then start with the highest-value one your existing data already supports. Anything that needs new data collection gets sequenced later.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ faqGroup1 }}\">\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle1_0 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">Who owns the code and the models?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign1_0 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen1_0 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">You do, from the first commit. Work happens in your repositories and your cloud accounts, under your licence terms, so nothing is locked behind our tooling.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle1_1 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">Who is actually on the team?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign1_1 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen1_1 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">Senior pods of three to six engineers who have shipped the same class of system before. The people on your first call stay on the account through delivery.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle1_2 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">Do you work alongside our own engineers?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign1_2 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen1_2 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">Yes. We work inside your repo, ticket tracker and coding standards, and treat runbooks and architecture notes as deliverables rather than favours.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle1_3 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">What happens after launch?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign1_3 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen1_3 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">Your team takes it over with documentation, or we operate it on an agreed support window with retraining schedules, drift alerts and rollback paths in place.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ faqGroup2 }}\">\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle2_0 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">Is Wappnet.ai certified?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign2_0 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen2_0 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">Yes. We hold ISO 27001 and SOC 2 Type II, and we have completed enterprise vendor reviews in regulated healthcare and financial services environments.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle2_1 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">Where does our data live?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign2_1 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen2_1 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">In your cloud accounts and regions. We build inside your tenancy, so data does not leave your environment for training or inference unless you explicitly ask for it.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle2_2 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">Can models run without sending data to a third party?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign2_2 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen2_2 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">Yes. Where data residency or privacy rules rule out a hosted API, we deploy open-weight models inside your own environment and tune them there.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div>\n            <button sc-camel-on-click=\"{{ faqToggle2_3 }}\" style=\"width:100%;background:none;border:0;border-bottom:1px solid #E4E1DC;padding:26px 0;display:flex;align-items:center;justify-content:space-between;gap:24px;text-align:left;cursor:pointer;font-family:'Archivo',sans-serif;font-size:17.5px;font-weight:700;color:#141414;line-height:1.35\">\n              <span style=\"text-wrap:pretty\">How do you stop an AI system failing quietly?<\u002Fspan>\n              <span style=\"font-size:22px;line-height:1;color:#C2571A;flex:none\">{{ faqSign2_3 }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ faqOpen2_3 }}\">\n              <div style=\"padding:20px 0 28px;border-bottom:1px solid #E4E1DC;font-size:16px;line-height:1.65;color:#555;max-width:70ch;text-wrap:pretty\">Every system ships with an evaluation set, a regression suite and a refusal policy, so any prompt or model change is scored before it reaches production.<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"one-company\" style=\"background:#0D0D0F;color:#fff;padding:112px 0\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 24px\">\n      <div data-reveal=\"\" style=\"margin-bottom:52px;max-width:52ch\">\n        <div style=\"font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#F4A557;margin-bottom:16px\">Two sites, one company<\u002Fdiv>\n        <h2 style=\"font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.02em;line-height:1.22;max-width:24ch;text-wrap:pretty;color:#fff\">One company, pointed at two different problems<\u002Fh2>\n        <p style=\"margin-top:20px;font-size:16.5px;color:rgba(255,255,255,.6);max-width:48ch\">Most clients arrive at one and end up using both. Either way it is one contract, one account team, and the same engineering standards.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px\">\n        <div style=\"border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:40px;display:flex;flex-direction:column;gap:24px\">\n          <div>\n            <div style=\"background:#fff;border-radius:12px;padding:16px 22px;display:inline-flex;align-items:center\">\n              <img src=\"8ccf0f63-d1ea-40a1-acae-ce40b95fbe8a\" alt=\"Wappnet Systems\" style=\"height:30px;width:auto;display:block\">\n            <\u002Fdiv>\n            <p style=\"margin-top:26px;font-family:'Archivo',sans-serif;font-size:19px;font-weight:600;line-height:1.35;color:#fff;max-width:26ch\">The product and platform engineering side.<\u002Fp>\n            <p style=\"margin-top:14px;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.6);max-width:38ch\">Web and mobile products, integrations, cloud and DevOps. The systems your business runs on every day.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:auto\">\n            <span style=\"border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:8px 15px;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.75);white-space:nowrap\">Product engineering<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:8px 15px;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.75);white-space:nowrap\">Mobile apps<\u002Fspan>\n            <span style=\"border:1px solid rgba(255,255,255,.18);border-radius:100px;padding:8px 15px;font-family:'Archivo',sans-serif;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.75);white-space:nowrap\">Cloud &amp; DevOps<\u002Fspan>\n          <\u002Fdiv>\n          <a href=\"https://wappnet.com\" style=\"display:inline-flex;align-items:center;gap:10px;font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;border:1.5px solid rgba(255,255,255,.5);padding:13px 20px;align-self:flex-start;transition:background .2s ease,color .2s ease\" style-hover=\"background:#fff;color:#0D0D0F\">Visit wappnet.com <span style=\"font-size:15px;flex:none\">→<\u002Fspan><\u002Fa>\n        <\u002Fdiv>\n        <div style=\"border-radius:24px;padding:40px;ba
